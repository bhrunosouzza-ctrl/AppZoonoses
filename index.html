<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProdAnalytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* slate-950 */
        color: #f8fafc;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; /* slate-800 */
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; /* slate-600 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; /* slate-500 */
      }
    </style>

<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 24px; color: #f8fafc; background-color: #0f172a; min-height: 100vh; font-family: system-ui, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box;">
              <div style="max-width: 600px; width: 100%; background-color: #1e293b; border: 1px solid #334155; padding: 24px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); box-sizing: border-box;">
                <h1 style="color: #ef4444; font-size: 20px; font-weight: bold; margin-top: 0; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                  ⚠️ Erro de Carregamento
                </h1>
                <p style="color: #94a3b8; font-size: 14px; margin-bottom: 16px;">
                  Ocorreu um erro ao carregar os recursos do aplicativo. Isso pode ser causado por um erro de importação de biblioteca ou falha de script.
                </p>
                <div style="background-color: #020617; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 12px; color: #f1f5f9; overflow-x: auto; white-space: pre-wrap; margin-bottom: 16px; border: 1px solid #1e293b;">
                  ${event.message} no arquivo ${event.filename}:${event.lineno}:${event.colno}
                </div>
                <button onclick="window.location.reload()" style="background-color: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background-color 0.2s;">
                  Recarregar Aplicativo
                </button>
              </div>
            </div>
          `;
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 24px; color: #f8fafc; background-color: #0f172a; min-height: 100vh; font-family: system-ui, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box;">
              <div style="max-width: 600px; width: 100%; background-color: #1e293b; border: 1px solid #334155; padding: 24px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); box-sizing: border-box;">
                <h1 style="color: #ef4444; font-size: 20px; font-weight: bold; margin-top: 0; margin-bottom: 12px;">
                  ⚠️ Erro de Promessa Rejeitada
                </h1>
                <p style="color: #94a3b8; font-size: 14px; margin-bottom: 16px;">
                  Uma operação assíncrona falhou sem ser capturada.
                </p>
                <div style="background-color: #020617; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 12px; color: #f1f5f9; overflow-x: auto; white-space: pre-wrap; margin-bottom: 16px; border: 1px solid #1e293b;">
                  ${event.reason}
                </div>
                <button onclick="window.location.reload()" style="background-color: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background-color 0.2s;">
                  Recarregar Aplicativo
                </button>
              </div>
            </div>
          `;
        }
      });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
